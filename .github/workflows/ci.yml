name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type-check
        run: pnpm --dir apps/desktop check
      - name: Build frontend
        run: pnpm --dir apps/desktop build

  backend:
    name: API tests
    runs-on: ubuntu-latest
    env:
      APP_SECRET: ci-only-test-secret-not-for-production
      DATABASE_URL: sqlite:////tmp/shopnex-ci.db
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/api/requirements.txt
      - name: Install API dependencies
        run: python -m pip install -r services/api/requirements.txt
      - name: Run API tests
        working-directory: services/api
        run: python -m pytest -q
