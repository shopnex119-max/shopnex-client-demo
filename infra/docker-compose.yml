services:
  postgres:
    image: postgres:16-alpine
    container_name: shopnex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: shopnex
      POSTGRES_USER: shopnex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - shopnex-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopnex -d shopnex"]
      interval: 5s
      timeout: 3s
      retries: 15
    networks: [shopnex-local]

volumes:
  shopnex-postgres:

networks:
  shopnex-local:
    driver: bridge
